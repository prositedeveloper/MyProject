{% extends 'base.html' %} 

{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a href="{% url 'home' %}">Главная</a>
    </li>
    <li class="breadcrumb-item">
      <a href="{{ news_item.category.get_absolute_url }}"
        >{{ news_item.category.title }}</a
      >
    </li>
    <li class="breadcrumb-item active" aria-current="page">
      {{ news_item.title }}
    </li>
  </ol>
</nav>

<div class="card mb-3">
  <div class="card-body">
    {% if news_item.photo %}
    <img src="{{ news_item.photo.url }}" alt="{{ news_item.title }}" class="mr-3" width="350" />
    {% else %}
    <img
      src="https://picsum.photos/id/1060/350/235/?blur=2"
      alt=""
      class="mr-3"
    />
    {% endif %}
    <h5 class="card-title">{{ news_item.title }}</h5>
    <p class="card-text">{{ news_item.content|safe|linebreaks }}</p>
  </div>
  <div class="card-footer text-muted">
    {{ news_item.created_at|date:"Y-m-d H:i:s" }}
  </div>
</div>
{% endblock %}
